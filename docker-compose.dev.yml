# Versión de desarrollo siempre encendida, para probar desde el celular por tu tailnet.
# Se levanta con ./scripts/dev-tailnet.sh (ver README). El código es el de esta carpeta:
# al hacer `git pull` la app se actualiza sola, sin reconstruir nada.
name: abordo-dev

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: abordo_dev
      APP_DB_PASSWORD: abordo_dev
    volumes:
      - ./data/dev-postgres:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo en esta máquina, para herramientas como psql.
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abordo"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${NODE_DEV_IMAGE:-node:22-slim}
    restart: unless-stopped
    working_dir: /app
    # Instala dependencias, prepara llaves de push, aplica migraciones con datos de demostración y arranca.
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && node scripts/dev-env.mjs && pnpm seed && pnpm dev --hostname 0.0.0.0"
    environment:
      DATABASE_URL: postgres://abordo:abordo_dev@db:5432/abordo
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      # La caché de paquetes va en un volumen, no dentro de la carpeta del proyecto.
      npm_config_store_dir: /pnpm-store
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm-store
    ports:
      # Solo en esta máquina: hacia afuera sale únicamente por `tailscale serve`.
      - "127.0.0.1:${DEV_PORT:-3000}:3000"
    depends_on:
      db: { condition: service_healthy }

volumes:
  node_modules:
  next_cache:
  pnpm_store:
